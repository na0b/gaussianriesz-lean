        Trellis multi-agent formalization pipeline: planner, reviewer and worker agents write a
        dependency graph of natural-language nodes (a blueprint) and their Lean proofs; separate
        verifier agents check each node's natural-language proof for soundness, its faithfulness
        to the paper, and agreement between its Lean and natural-language statements; the Lean
        kernel checks every proof. A human approves the phase gates and answers escalations.
      cost:
        wall_time: "about 5 days of running in two stages (2026-10-04 to 10-07: Theorem 5.1; 2026-10-21 to 10-23: the remaining targets on the revised paper), 227 cycles"
        spend_usd: "subscription-based"
        hardware: "local machine (Linux workstation) plus subscription model access"
      prompting_notes: "Standard Trellis prompts; the input was the paper's LaTeX source and the choice of target theorems."
    - method: agent
      models: ["Claude Opus 5 (Anthropic)"]
      framework: "Claude Code"
      tool_setup: >-
        Export from the Trellis workspace to this repository, the port to Lean v4.35.0-rc2 and
        the module system (adapting 22 files to Mathlib's new MemLp/eLpNorm API), and the
        Challenge/Solution/Comparator packaging for Palomar, done by Claude Code under the
        maintainer's direction.
      cost:
        wall_time: "a few hours"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "n/a"
  spend_usd: "subscription-based"
  notes: >-
    The Lean proofs and the blueprint were written by AI agents under the Trellis protocol.
    Juan J. Manfredi chose the targets, supervised the runs, approved the phase gates and decided
    the scope questions raised during the run; he is responsible for the repository.

fidelity:
  divergences: >-
    (1) Proposition 5.3: the paper's proof quotes the fixed-dimension maximal estimate (5.15) of
    Fabes–Gutiérrez–Scotto, which is not in Mathlib. The formalization proves instead a localized
    maximal-truncation estimate (level sets intersected with a ball B(0,R), constant depending on
    n, j, R) via Cotlar's inequality and Theorem 5.1. Since (5.15) is used only for almost-everywhere
    and limit statements, this suffices, and the statement of Proposition 5.3 is the paper's, with
    bound 2. (2) Theorem 3.1: only Dom(B) ⊆ W^{1,2}(γₙ) is formalized, not equality. (3) Corollary
    5.4's unnormalized measure e^{-|x|²}dx is generalized to c·γₙ for every c > 0 (the paper's case
    is c = π^{n/2}). (4) Corollary 5.5 is stated as existence and uniqueness of the extension
    with the bound. (5) Representation choices: the L¹ extension takes values in a.e.-classes of
    measurable functions (`→ₘ[γₙ]`); L^s, Dom(L^s), the energy and the Hermite basis are defined
    through Hermite coefficients, with h_α = ∏ He_{αⱼ}(√2 xⱼ)/√(αⱼ!) (Mathlib's probabilists'
    Hermite polynomials), equal to the paper's normalized physicists' Hermite polynomials;
    weak gradients are defined against smooth compactly supported test functions with Lebesgue
    integrals; W^{1,2}(γₙ) is defined via the normalized gradient D = 2^{-1/2}∇.

review:
  status: "agent-reviewed"
  reviewers:
    - "Trellis verifier agents (soundness, paper-faithfulness and statement-correspondence checks on every node)"
  notes: >-
    Every node passed Trellis's automated soundness, paper-faithfulness and Lean/natural-language
    correspondence reviews, and Cleanup ran six audit rounds; the Proposition 5.3 deviation was
    reviewed separately during the run. No human review of the Lean statements against the paper
    has been recorded yet.


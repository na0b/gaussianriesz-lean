# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "A dimension-free weak-type (1,1) bound for the Gaussian Riesz transforms"
  description: >-
    A complete Lean 4 / Mathlib formalization of the main results of Gutiérrez and Manfredi,
    "A direct obstacle proof of a dimension-free weak-type (1,1) bound for the Gaussian Riesz
    transforms" (arXiv:2610.26478). For the Gaussian measure dγₙ = π^{-n/2} e^{-|x|²} dx on ℝⁿ,
    the Ornstein–Uhlenbeck operator L = -½Δ + x·∇ and the normalized gradient D = 2^{-1/2}∇, the
    vector Riesz transform R_γ = D L^{-1/2} Π₀ has exactly one linear extension to L¹(γₙ)
    satisfying t·γₙ{|R_γ f| > t} ≤ 2‖f‖₁ for all t > 0, in every dimension n (Theorem 5.1). The
    proof goes through a Gaussian obstacle decomposition F = g + L^{1/2}u, with existence,
    uniqueness and the variational characterization of u, and the identification
    Dom(L^{1/2}) ⊆ W^{1,2}(γₙ) (Theorem 3.1). Also formalized: the principal-value realization of
    the extension by the Gaussian Riesz kernels (Proposition 5.3), the coordinatewise,
    historically normalized and unnormalized-measure bounds (Corollary 5.4), and the
    complex-valued bound with constant 8/π (Corollary 5.5). The Hermite basis of L²(γₙ) and the
    spectral calculus of L are built from Mathlib; there is no sorry and no axiom beyond
    propext, Classical.choice and Quot.sound.
  authors:
    - "Cristian E. Gutiérrez"
    - "Juan J. Manfredi"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Juan J. Manfredi"

classification:
  arxiv: [math.CA, math.FA]
  msc2020: [42B20, 42C10, 35J86, 47A60, 68V20]

sources:
  - title: "A direct obstacle proof of a dimension-free weak-type (1,1) bound for the Gaussian Riesz transforms"
    authors:
      - "Cristian E. Gutiérrez"
      - "Juan J. Manfredi"
    id: "arXiv:2610.26478"
    type: paper
    location: "https://arxiv.org/abs/2610.26478"
    relationship: formalizes
    note: >-
      Theorems 3.1 and 5.1, Proposition 5.3 and Corollaries 5.4 and 5.5 are formalized. The paper's
      authors are the authors of this formalization.
    author_endorsement: participated
  - title: "Fabes, Gutiérrez and Scotto, Weak-type estimates for the Riesz transforms associated with the Gaussian measure (Rev. Mat. Iberoam. 10 (1994))"
    authors:
      - "Eugene B. Fabes"
      - "Cristian E. Gutiérrez"
      - "Roberto Scotto"
    type: paper
    relationship: background
    note: >-
      The fixed-dimension maximal estimate (5.15) of this paper is quoted in the source's proof of
      Proposition 5.3. The formalization does not assume it; it proves a localized form instead
      (see fidelity).

related_formalizations: []

status:
  scope: >-
    Formalized in full, with everything their proofs use: Theorem 3.1 (split into existence with
    the variational characterization, uniqueness of the pair, and Dom(B) ⊆ W^{1,2}(γₙ) with
    ‖Bv‖ = ‖Dv‖), Theorem 5.1, Proposition 5.3, Corollary 5.4 (split into its three assertions)
    and Corollary 5.5. Only the inclusion Dom(B) ⊆ W^{1,2}(γₙ) of the paper's equality
    Dom(B) = W^{1,2}(γₙ) is formalized; the theorems use only this inclusion. Not formalized:
    remarks, examples and expository material.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

